name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite includes a Python/JS parity check that shells out to node;
      # without it those tests silently skip and the two scorers can drift.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pytest
      - run: pytest skill/imm-evaluator/tests/ -v
